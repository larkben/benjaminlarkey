<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#fafbf9" />
    <title>Writing — Benjamin Larkey</title>
    <script>try { const savedTheme = localStorage.getItem("theme"); if (savedTheme) document.documentElement.dataset.theme = savedTheme; } catch {}</script>
    <style>
      :root { color-scheme: light; --ink: #202c2a; --muted: #687773; --accent: #0066cc; --red: #d93645; --paper: #fafbf9; --line: #e2e8e4; --surface: #fff; }
      :root[data-theme="dark"] { color-scheme: dark; --ink: #ecf3fb; --muted: #a5b2c0; --accent: #59a6ff; --red: #ff6675; --paper: #101923; --line: #2a3948; --surface: #172431; }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.6 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      a { color: inherit; }
      .page { width: min(100% - 40px, 860px); margin: 0 auto; }
      header { display: flex; align-items: center; justify-content: space-between; padding: 26px 0; border-bottom: 1px solid var(--line); }
      .brand { font-weight: 700; letter-spacing: -.03em; text-decoration: none; }
      nav { display: flex; gap: 24px; color: var(--muted); font-size: .92rem; }
      .theme-toggle { padding: 7px 10px; border: 1px solid var(--line); border-radius: 5px; background: transparent; color: var(--ink); font: inherit; font-size: .82rem; cursor: pointer; }
      .theme-toggle:hover { background: var(--surface); }
      nav a { text-decoration: none; } nav a:hover, .back:hover, .admin:hover { color: var(--red); }
      main { padding: 70px 0 84px; }
      .topline { display: flex; align-items: center; justify-content: space-between; }
      .back, .admin { color: var(--muted); font-size: .9rem; text-decoration: none; }
      h1 { margin: 24px 0 8px; font-size: clamp(2.6rem, 7vw, 4rem); line-height: 1.05; letter-spacing: -.06em; }
      h1::after { display: block; width: 42px; height: 3px; margin-top: 16px; background: linear-gradient(90deg, var(--accent) 0 72%, var(--red) 72%); content: ""; }
      .intro { margin: 0 0 38px; color: var(--muted); }
      .post { padding: 22px 0; border-top: 1px solid var(--line); }
      time { color: var(--muted); font-size: .84rem; }
      h2 { margin: 5px 0 8px; font-size: 1.25rem; letter-spacing: -.02em; }
      .post p { margin: 0; color: var(--muted); white-space: pre-wrap; }
      footer { padding: 22px 0 35px; border-top: 1px solid var(--line); color: var(--muted); font-size: .85rem; }
      @media (max-width: 600px) { .page { width: min(100% - 32px, 860px); } header { align-items: flex-start; gap: 14px; flex-direction: column; padding: 20px 0; } nav { width: 100%; flex-wrap: wrap; align-items: center; gap: 10px 18px; } nav a { padding: 4px 0; } .theme-toggle { margin-left: auto; } main { padding: 52px 0 64px; } .topline { align-items: flex-start; gap: 12px; flex-direction: column; } .intro { margin-bottom: 28px; } }
      @media (max-width: 380px) { nav { gap: 8px 14px; font-size: .86rem; } .theme-toggle { margin-left: 0; } }
    </style>
  </head>
  <body>
    <div class="page">
      <header>
        <a class="brand" href="/">Benjamin Larkey</a>
        <nav aria-label="Main navigation"><a href="/projects">Projects</a><a href="/">Resume</a><a href="/admin">Admin</a><button class="theme-toggle" type="button" aria-label="Switch color theme">☾ Dark mode</button></nav>
      </header>
      <main>
        <div class="topline"><a class="back" href="/">← Back to resume</a><a class="admin" href="/admin/login">Admin login</a></div>
        <h1>Writing</h1>
        <p class="intro">Notes on healthcare data, interoperability, and things I’m learning along the way.</p>
        {{POSTS}}
      </main>
      <footer>© 2026 Benjamin Larkey</footer>
    </div>
    <script src="/theme.js" defer></script>
  </body>
</html>
